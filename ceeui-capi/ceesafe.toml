[package]
name = "ceeui_capi"
version = "0.1.0"
# CeeUI for C, and through C for Swift, Kotlin and Rust (roadmap P6): `ceesafec build` makes out/ceeui_capi.a
# and its headers (CeeSafe ADR 0088; `--emit lib` before 0.80.2); include/ceeui.h is the API a host uses.
kind = "library"
ceesafec = ">=0.78.0"

[dependencies]
ceeui = { path = "../ceeui" }
ceeui_desktop = { path = "../ceeui-desktop" }
ceeui_fonts = { path = "../ceeui-fonts" }
