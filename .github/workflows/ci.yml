# CeeUI CI (roadmap P0): on macOS, Linux and Windows, every package checked and formatted, the test suite, every
# host built, the hosts run (the terminal host once, the browser host end to end), and the benchmarks against their
# budgets (tools/bench.py, bench/budgets.json), whose numbers go to the run's summary and an artifact.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release CeeUI was last tested with and is formatted by. 0.88.0 or later: the Kotlin binding opens its window
  # on Linux and Windows from the JVM's thread (CeeSafe ADR 0201), and library builds are position-independent on
  # Linux (ADR 0202); 0.86.0: the C API's bindings open windows on iOS and Android as host programs (ADR 0200); 0.85.0: functions passing a Style by value are kept out of
  # line (ADR 0199, CEESAFE-FINDINGS.md Q4); 0.84.0: ceeui-pack passes --arch for each Android ABI (ADR 0192); on
  # Linux, 0.77's runtime left the browser host's input unread when its frames ran behind. 0.95.3: the system's Back,
  # WindowKey.Back and Window.setBackWanted (ADR 0233), which ceeui-desktop maps.
  CEESAFE_VERSION: v0.95.3

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install ceesafec (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://ceesafe.github.io/CeeSafe/install.sh | sh
          echo "$HOME/.ceesafe/bin" >> "$GITHUB_PATH"

      - name: Install ceesafec (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://ceesafe.github.io/CeeSafe/install.ps1 | iex
          Add-Content $env:GITHUB_PATH (Join-Path $HOME ".ceesafe\bin")

      - name: Toolchain
        run: ceesafec --version

      # Vulkan's headers for the GPU host; Liberation fonts, which have Arial's and Courier New's metrics, for the
      # headless and browser hosts.
      - name: Libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev fonts-liberation

      # The GPU host's Vulkan backend includes <vulkan/vulkan.h> from $VULKAN_SDK/Include; the headers alone do.
      - name: Vulkan headers (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch v1.3.280 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vk"
          echo "VULKAN_SDK=$RUNNER_TEMP/vk" >> "$GITHUB_ENV"

      - name: Check and format
        run: |
          set -e
          for p in ceeui ceeui-capi ceeui-demo ceeui-demo-tasks ceeui-desktop ceeui-dev ceeui-fonts \
                   ceeui-tasks ceeui-web ceeui-pack ceeui-tests ceeui-hosts/headless \
                   ceeui-hosts/desktop ceeui-hosts/gpu ceeui-hosts/terminal ceeui-hosts/browser \
                   ceeui-hosts/web; do
            echo "== $p"
            (cd "$p" && ceesafec check && ceesafec fmt --check)
          done

      - name: The C API's example, built and linked
        working-directory: ceeui-capi
        run: ./examples/build.sh

      # The bindings over the C API (ceeui-capi/bindings), built against its archive: Rust everywhere, Swift on
      # macOS, Kotlin through JNI on macOS and Linux. Built only: a runner has no screen to run their windows on.
      - name: The C API's Rust binding
        working-directory: ceeui-capi/bindings/rust
        run: cargo build --example counter

      - name: The C API's Swift binding (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          (cd ceeui-capi && MACOSX_DEPLOYMENT_TARGET=13.0 ceesafec build)
          cd ceeui-capi/bindings/swift && swift build

      - name: The C API's Kotlin binding (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" ceeui-capi/bindings/kotlin/build.sh
          # On the Mac, the phones too (CeeSafe ADR 0200): the Swift counter for the iOS simulator, and the Kotlin
          # counter as an Android app, with the runner's Xcode and Android SDK.
          if [ "$(uname -s)" = Darwin ]; then
            ceeui-capi/bindings/swift/build-ios.sh simulator
            KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" ceeui-capi/bindings/kotlin/build-android.sh
          fi

      - name: Tests
        working-directory: ceeui-tests
        run: ceesafec test

      # The documentation site (site/README.md): every CeeSafe example of its pages compiled against CeeUI, and the
      # site built, which fails on a dead link. Linux only: the pages are the same everywhere.
      - name: The guide's examples
        if: runner.os == 'Linux'
        run: python3 tools/guide_check.py

      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: The site
        if: runner.os == 'Linux'
        working-directory: site
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Build the hosts
        run: |
          set -e
          for p in ceeui-hosts/headless ceeui-hosts/desktop ceeui-hosts/gpu ceeui-hosts/terminal \
                   ceeui-hosts/browser ceeui-pack ceeui-dev; do
            echo "== $p"
            (cd "$p" && ceesafec build)
          done

      # Why the headless host is the size it is: its segments, and the objects it was built from.
      - name: The headless host's size
        if: runner.os != 'Windows'
        run: |
          cd ceeui-hosts/headless/out
          ls -la
          if [ "$(uname -s)" = Darwin ]; then size -m headless | grep -E '^Segment|total' ; else size -A headless | sort -k2 -n | tail -8; fi
          cc --version | head -1
          python3 ../../../tools/largest_functions.py headless 25

      - name: A new app from the template
        if: runner.os != 'Windows' # ceeui-pack needs a Unix
        run: |
          set -e
          python3 ceeui-pack/template/make_templates.py
          git diff --exit-code ceeui-pack/src/templates.cee # templates.cee made from template/ as it is
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/ceeui-pack/out/ceeui_pack" new ci_app --ceeui "$GITHUB_WORKSPACE"
          cd ci_app && ceesafec fetch && ceesafec check && ceesafec fmt --check && ceesafec build

      - name: Terminal host, one frame
        working-directory: ceeui-hosts/terminal
        run: |
          CEEUI_ONCE=1 ./out/terminal > frame.txt
          grep -q "CeeUI on CeeSafe" frame.txt

      - name: Browser host, end to end
        working-directory: ceeui-hosts/browser
        run: |
          export CEEUI_FONT_DIR="$RUNNER_TEMP/fonts"
          python3 ../../tools/bench.py --fonts "$CEEUI_FONT_DIR"
          ./out/browser 8391 > browser.log 2>&1 &
          host=$!
          for _ in $(seq 50); do grep -q "open http" browser.log && break; sleep 0.2; done
          status=0
          mkdir -p "$RUNNER_TEMP/frames"
          python3 test_client.py 8391 "$RUNNER_TEMP/frames" || status=$?
          kill $host || true
          cat browser.log
          exit $status

      - name: Keep the browser host's frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-frames-${{ matrix.os }}
          path: ${{ runner.temp }}/frames
          if-no-files-found: ignore

      - name: Benchmarks
        run: |
          python3 tools/bench.py --json "bench-${{ matrix.os }}.json" --markdown "$GITHUB_STEP_SUMMARY"

      - name: Keep the benchmark numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.json
          if-no-files-found: ignore
