[package]
name = "claywind_capi"
version = "0.1.0"
# ClayWind for C, and through C for Swift, Kotlin and Rust (roadmap P6): `ceesafec build` makes out/claywind_capi.a
# and its headers (CeeSafe ADR 0088; `--emit lib` before 0.80.2); include/claywind.h is the API a host uses.
kind = "library"
ceesafec = ">=0.78.0"

[dependencies]
claywind = { path = "../claywind" }
claywind_desktop = { path = "../claywind-desktop" }
claywind_fonts = { path = "../claywind-fonts" }
