[package]
name = "desktop"
version = "0.1.0"
kind = "executable"
windowed = true # a GUI program: no console window on Windows (CeeSafe ADR 0151)
ceesafec = ">=0.93.2" # Window.openStyled (CeeSafe ADR 0206)

[dependencies]
claywind = { path = "../../claywind" }
claywind_demo = { path = "../../claywind-demo" }
claywind_fonts = { path = "../../claywind-fonts" }
claywind_demo_tasks = { path = "../../claywind-demo-tasks" }
claywind_desktop = { path = "../../claywind-desktop" }
